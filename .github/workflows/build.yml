# 可复用的构建工作流（被各模组仓库的 caller 通过 workflow_call 调用）
#
# 用途：push / pull_request 时的构建检查。
# 各模组仓库的 .github/workflows/build.yml 只需：
#   jobs:
#     build:
#       uses: pasze888/mc-mod-ci/.github/workflows/build.yml@main
# 本工作流运行在被调用的模组仓库上下文中（github.* 指向调用方）。
name: Build (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mod-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error