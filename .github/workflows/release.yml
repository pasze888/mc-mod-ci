# 可复用的发布工作流（被各模组仓库的 caller 通过 workflow_call 调用）
#
# 触发：各模组仓库推送 tag（caller 里 on.push.tags: ['*-*-*-*']）。
# tag 格式：<mod_id>-<mc_version>-<loader>-<mod_version>，例如 milkbottle-1.21.1-neoforge-1.0.0
#
# 行为：
#   * 用 tag 末段作为版本号，通过 -Pmod_version= 覆盖构建（Q12=b，tag 是唯一真相源）
#   * mc-publish 一把梭创建 GitHub Release（GitHub Release 全覆盖）
#   * CurseForge 是开关：仅当该仓库 gradle.properties 存在 curseforge_project_id 才上传，
#     否则 mc-publish 只发 GitHub Release（少数模组开 CF，多数只发 GitHub）
#   * changelog 由 mc-publish 从 commit 自动生成（Q8=A）
#
# JDK 与发布元数据：决定顺序同 build.yml（输入 > gradle.properties 的 java_version/javaVersion > 21），
# 装出来的 JDK 与 mc-publish 的 java 字段取同一个值，避免二者漂移。
#
# 可选输入（都可不传；不传即维持 1.21.x + neoforge 现状，老 caller 无需改动）：
#   java-version    覆盖 JDK 版本（一般不用传，交给 gradle.properties）
#   loaders         mc-publish 的 loaders，默认 'neoforge'（多值用逗号分隔，下同）
#   game-versions   mc-publish 的 game-versions，默认 '1.21.1'
# 传入示例（26.x 分支，Java 用属性驱动时只需改 game-versions）：
#   jobs:
#     release:
#       uses: pasze888/mc-mod-ci/.github/workflows/release.yml@main
#       secrets: inherit
#       with:
#         game-versions: '26.1'
name: Release (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: '覆盖 JDK 版本；留空则读仓库 gradle.properties 的 java_version/javaVersion，再回退 21'
        required: false
        type: string
        default: ''
      loaders:
        description: 'mc-publish 的 loaders，多值用逗号分隔'
        required: false
        type: string
        default: 'neoforge'
      game-versions:
        description: 'mc-publish 的 game-versions，多值用逗号分隔'
        required: false
        type: string
        default: '1.21.1'

# GitHub Release / CurseForge 上传都需要写权限
permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # 手动触发（workflow_dispatch）时 ref 是分支而非 tag，必须有 tag 才继续
      - name: "Guard: tag ref required"
        if: ${{ github.ref_type != 'tag' }}
        run: |
          echo "::error::Release 只应在推送 tag 时触发,已中止。"
          exit 1

      - name: Checkout tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve JDK version
        id: java
        shell: bash
        env:
          INPUT_JAVA_VERSION: ${{ inputs.java-version }}
        run: |
          VERSION="$INPUT_JAVA_VERSION"
          if [ -z "$VERSION" ] && [ -f gradle.properties ]; then
            VERSION="$(sed -nE 's/^[[:space:]]*(java_version|javaVersion)[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -1 | tr -d '\r[:space:]')"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="21"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "使用 JDK $VERSION"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read project metadata
        id: props
        shell: bash
        run: |
          # 从 gradle.properties 读取 mod 名、curseforge 开关、gradle.properties 里的 mod_version
          mod_name=""
          mod_version=""
          cf_id=""
          if [ -f gradle.properties ]; then
            mod_name="$(sed -n 's/^mod_name[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -1 | tr -d '\r')"
            mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -1 | tr -d '\r')"
            cf_id="$(sed -n 's/^curseforge_project_id[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -1 | tr -d '\r[:space:]')"
          fi
          echo "mod_name=${mod_name}" >> "$GITHUB_OUTPUT"
          echo "gradle_mod_version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "curseforge_project_id=${cf_id}" >> "$GITHUB_OUTPUT"

      - name: Derive version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG##*-}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # 按版本后缀决定 release 类型（CF / GH 的 prerelease 判定）
          case "$VERSION" in
            *-alpha*)  TYPE="alpha"  ;;
            *-beta*)   TYPE="beta"   ;;
            *-rc*)     TYPE="beta"   ;;
            *)         TYPE="release";;
          esac
          echo "version_type=${TYPE}" >> "$GITHUB_OUTPUT"

      - name: Build with tag version
        run: |
          ./gradlew build --no-daemon \
            -Pmod_version="${{ steps.version.outputs.version }}"

      # 无 curseforge_project_id：只发 GitHub Release（mc-publish 不传任何 curseforge 参数，
      # 否则会按 slug 去探测 CurseForge 项目导致失败）。
      - name: "Publish GitHub Release only"
        if: ${{ steps.props.outputs.curseforge_project_id == '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: build/libs/!(*-@(sources|javadoc|dev|dev-shadow)).jar
          name: ${{ steps.props.outputs.mod_name }} ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.version_type }}
          loaders: ${{ inputs.loaders }}
          game-versions: ${{ inputs.game-versions }}
          java: ${{ steps.java.outputs.version }}
          environment: client | server
          fail-mode: fail

      # 有 curseforge_project_id：GitHub Release + CurseForge 一起发。
      - name: "Publish GitHub Release + CurseForge"
        if: ${{ steps.props.outputs.curseforge_project_id != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          curseforge-id: ${{ steps.props.outputs.curseforge_project_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/!(*-@(sources|javadoc|dev|dev-shadow)).jar
          name: ${{ steps.props.outputs.mod_name }} ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.version_type }}
          loaders: ${{ inputs.loaders }}
          game-versions: ${{ inputs.game-versions }}
          java: ${{ steps.java.outputs.version }}
          environment: client | server
          fail-mode: fail
